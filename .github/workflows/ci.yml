name: Calculator CI

on:
  pull_request:
    branches: main
  run: tests

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run the tests
        run: ./check.sh
